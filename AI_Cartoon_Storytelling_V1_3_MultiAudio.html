&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;1. Connect your private AI service&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Cloudflare Worker securely calls FLUX for cartoon images and GLM for scripts. GitHub Pages alone cannot generate AI images. Never put API tokens or the access code into GitHub files.&lt;/p&gt;&lt;div class=&quot;fields&quot;&gt;&lt;div&gt;&lt;label&gt;Worker URL (https://…workers.dev)&lt;/label&gt;&lt;input id=&quot;url&quot; placeholder=&quot;https://cartoon-ai.yourname.workers.dev&quot; type=&quot;url&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Private studio access code&lt;/label&gt;&lt;input id=&quot;pin&quot; type=&quot;password&quot; autocomplete=&quot;off&quot; placeholder=&quot;Set in Cloudflare Secret variable&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;test&quot; class=&quot;alt&quot;&gt;Test AI connection&lt;/button&gt;&lt;button id=&quot;health&quot; class=&quot;alt&quot;&gt;Check Worker deployment&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;You can prepare storyboard manually even before connecting. AI image buttons only work after Cloudflare setup.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;2. Story &amp; episode settings&lt;/h2&gt;&lt;div class=&quot;fields&quot;&gt;&lt;div&gt;&lt;label&gt;Story source&lt;/label&gt;&lt;select id=&quot;mode&quot;&gt;&lt;option value=&quot;auto&quot;&gt;Auto original story&lt;/option&gt;&lt;option value=&quot;manual&quot;&gt;Paste manual script&lt;/option&gt;&lt;option value=&quot;pdf&quot;&gt;Upload text PDF&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Language&lt;/label&gt;&lt;select id=&quot;lang&quot;&gt;&lt;option&gt;Urdu&lt;/option&gt;&lt;option&gt;English&lt;/option&gt;&lt;option&gt;Arabic&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Duration of this episode&lt;/label&gt;&lt;select id=&quot;duration&quot;&gt;&lt;option value=&quot;30&quot;&gt;30 seconds (Short)&lt;/option&gt;&lt;option value=&quot;60&quot;&gt;60 seconds (Short)&lt;/option&gt;&lt;option value=&quot;180&quot;&gt;3 minutes&lt;/option&gt;&lt;option value=&quot;240&quot;&gt;4 minutes&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Video format&lt;/label&gt;&lt;select id=&quot;format&quot;&gt;&lt;option value=&quot;short&quot;&gt;Vertical 9:16 Shorts&lt;/option&gt;&lt;option value=&quot;wide&quot;&gt;Horizontal 16:9&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Episode number&lt;/label&gt;&lt;input id=&quot;ep&quot; type=&quot;number&quot; value=&quot;1&quot; min=&quot;1&quot; max=&quot;10&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Total episodes in series&lt;/label&gt;&lt;input id=&quot;epTotal&quot; type=&quot;number&quot; value=&quot;1&quot; min=&quot;1&quot; max=&quot;10&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Scenes for this episode&lt;/label&gt;&lt;select id=&quot;sceneCount&quot;&gt;&lt;option value=&quot;4&quot;&gt;4&lt;/option&gt;&lt;option value=&quot;5&quot; selected&gt;5&lt;/option&gt;&lt;option value=&quot;6&quot;&gt;6&lt;/option&gt;&lt;option value=&quot;8&quot;&gt;8&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Art style&lt;/label&gt;&lt;select id=&quot;style&quot;&gt;&lt;option value=&quot;premium cinematic 3D family animation, beautiful global illumination, soft realistic materials, expressive faces&quot;&gt;Cinematic 3D cartoon&lt;/option&gt;&lt;option value=&quot;premium claymation stop-motion aesthetic, soft sculpted surfaces, whimsical colorful shapes&quot;&gt;Claymation style&lt;/option&gt;&lt;option value=&quot;beautiful hand-painted fantasy storybook illustration with cinematic composition&quot;&gt;Storybook fantasy&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;
&lt;label&gt;Story topic (Auto)&lt;/label&gt;&lt;input id=&quot;topic&quot; value=&quot;Ali and the magical rabbit discover a glowing door in a forest&quot; placeholder=&quot;Your cartoon topic&quot;&gt;
&lt;div id=&quot;scriptWrap&quot; class=&quot;hidden&quot;&gt;&lt;label&gt;Paste your own story (manual / extracted PDF)&lt;/label&gt;&lt;textarea id=&quot;script&quot; placeholder=&quot;Paste script, one paragraph per scene…&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
&lt;div id=&quot;pdfWrap&quot; class=&quot;hidden&quot;&gt;&lt;label&gt;Upload a text-based PDF (up to 20 MB)&lt;/label&gt;&lt;input id=&quot;pdf&quot; type=&quot;file&quot; accept=&quot;application/pdf,.pdf&quot;&gt;&lt;p class=&quot;muted&quot; id=&quot;pdfStatus&quot;&gt;Scanned PDFs without selectable text are not supported in V3.&lt;/p&gt;&lt;/div&gt;
&lt;label&gt;Main character bible (reuse exact description every episode)&lt;/label&gt;&lt;textarea id=&quot;character&quot; style=&quot;min-height:90px&quot;&gt;Ali is an original cheerful 8-year-old South Asian boy with round face, short black hair, large brown eyes, turquoise kurta and mustard-yellow sleeveless jacket. Nuri is a tiny white rabbit with long pink inner ears, blue eyes and a pink nose. Keep both outfits, colors and facial features consistent across scenes.&lt;/textarea&gt;
&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;storyAI&quot;&gt;✨ Generate AI storyboard&lt;/button&gt;&lt;button id=&quot;storyLocal&quot; class=&quot;alt&quot;&gt;Prepare scenes without AI&lt;/button&gt;&lt;button id=&quot;saveStory&quot; class=&quot;alt&quot;&gt;Save project JSON&lt;/button&gt;&lt;label style=&quot;margin:0;display:inline-block&quot;&gt;&lt;input id=&quot;loadProject&quot; type=&quot;file&quot; accept=&quot;.json,application/json&quot; style=&quot;max-width:170px;padding:8px&quot; aria-label=&quot;Load saved project&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;div class=&quot;row&quot;&gt;&lt;h2&gt;3. Scene images &amp; controls&lt;/h2&gt;&lt;span class=&quot;chip&quot; id=&quot;sceneLabel&quot;&gt;No scenes yet&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;Each image is freshly generated using FLUX (not fixed drawings). Same character description helps continuity but cannot guarantee identical faces. You may upload your own AI images for any scene.&lt;/p&gt;&lt;div id=&quot;scenes&quot; class=&quot;grid&quot;&gt;&lt;p class=&quot;muted&quot;&gt;Generate a storyboard first.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;allImages&quot; disabled&gt;🎨 Generate AI images for all scenes&lt;/button&gt;&lt;button id=&quot;clearImages&quot; class=&quot;alt&quot; disabled&gt;Clear images&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;4. Preview and export&lt;/h2&gt;&lt;p class=&quot;note&quot;&gt;Video uses cinematic camera panning/zoom over generated still images (Ken Burns animation), not characters walking/talking. To produce true animated character movement, a video-generation GPU service such as Wan 2.2 must be connected separately. Preview voice is not automatically included in exports.&lt;/p&gt;
&lt;div class=&quot;fields&quot;&gt;&lt;div&gt;&lt;label&gt;Optional prerecorded narration/music (MP3, M4A, WAV)&lt;/label&gt;&lt;input id=&quot;audioFile&quot; type=&quot;file&quot; accept=&quot;audio/*&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Voice preview language&lt;/label&gt;&lt;select id=&quot;speakLang&quot;&gt;&lt;option value=&quot;ur-PK&quot;&gt;Urdu&lt;/option&gt;&lt;option value=&quot;en-US&quot;&gt;English&lt;/option&gt;&lt;option value=&quot;ar-SA&quot;&gt;Arabic&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;preview&quot; class=&quot;alt&quot;&gt;▶ Preview&lt;/button&gt;&lt;button id=&quot;speak&quot; class=&quot;alt&quot;&gt;🔊 Speak captions (preview only)&lt;/button&gt;&lt;button id=&quot;stop&quot; class=&quot;alt&quot;&gt;■ Stop&lt;/button&gt;&lt;button id=&quot;record&quot;&gt;⬇ Record video (WebM)&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;status&quot; class=&quot;muted&quot;&gt;Please generate scenes first.&lt;/p&gt;&lt;canvas id=&quot;canvas&quot; width=&quot;540&quot; height=&quot;960&quot;&gt;&lt;/canvas&gt;&lt;p class=&quot;muted&quot;&gt;Export: WebM on compatible Chrome devices. MP4 is not promised; if needed, convert WebM to MP4 with an editor. Audio is included only when you upload an audio file and the device supports mixing.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Quality &amp; YouTube checklist&lt;/h2&gt;&lt;div class=&quot;note good&quot;&gt;Use an original story, consistent design, clear narration and scene progression. Select the correct “Made for Kids” audience setting on YouTube. Mass-produced repetitive material may be ineligible for monetization, even if generated with AI.&lt;/div&gt;&lt;/section&gt;&lt;p id=&quot;log&quot; role=&quot;status&quot;&gt;&lt;/p&gt;
&lt;/main&gt;&lt;footer&gt;V3 prototype — true AI artwork requires your own Cloudflare Worker connection; no payment or output guarantees. No passwords are stored in project exports.&lt;/footer&gt;
&lt;script&gt;
'use strict';
const $=id=&gt;document.getElementById(id);
let scenes=[],running=false,stopRun=null,loadedAudio=null,canPlay=false,mediaRec=null;
let lastMode='auto';
function log(t,err=false){$('log').textContent=t;$('log').className=err?'danger':'';}
function setStatus(t){$('status').textContent=t;}
function worker(){return $('url').value.trim().replace(/\/+$/,'');}
function cleanSettings(){return {mode:$('mode').value,lang:$('lang').value,topic:$('topic').value,script:$('script').value,character:$('character').value,style:$('style').value,episode:Number($('ep').value)||1,episodes:Number($('epTotal').value)||1,count:Number($('sceneCount').value)||5,duration:Number($('duration').value)||30,format:$('format').value};}
async function callWorker(path,payload){
 if(!/^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(worker())) throw Error('Enter the full Cloudflare workers.dev URL (https://…workers.dev).');
 if($('pin').value.length&lt;10) throw Error('Enter your private studio access code (10+ characters).');
 const res=await fetch(worker()+path,{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Code':$('pin').value},body:JSON.stringify(payload)});
 const data=await res.json().catch(()=&gt;({error:'Server did not return JSON'}));
 if(!res.ok)throw Error(data.error||'Worker returned '+res.status);
 return data;
}
$('test').onclick=async()=&gt;{log('Testing private AI service…');try{const data=await callWorker('/story',{mode:'auto',topic:'A small rabbit finds a golden star',language:'English',count:3,episode:1,episodes:1,character:'White rabbit',style:'colorful cinematic 3D children animation'});log('AI connected ✓ Storyboard test: '+(data.title||'success'));}catch(e){log(e.message,true)}};
$('health').onclick=async()=&gt;{try{if(!worker())throw Error('Enter Worker URL first');const r=await fetch(worker()+'/health'); const d=await r.json();log('Worker: '+JSON.stringify(d));}catch(e){log(e.message,true)}};
function modeUI(){const m=$('mode').value;$('scriptWrap').classList.toggle('hidden',m==='auto');$('pdfWrap').classList.toggle('hidden',m!=='pdf');lastMode=m;}
$('mode').onchange=modeUI;
$('pdf').onchange=async ev=&gt;{const f=ev.target.files?.[0];if(!f)return;
if(f.size&gt;20*1024*1024){$('pdfStatus').textContent='PDF too large (20 MB max)';return;}
if(!window.pdfjsLib){$('pdfStatus').textContent='PDF reader library has not loaded. Check internet connection.';return;}
$('pdfStatus').textContent='Reading PDF locally…';try{
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
 const parts=[];for(let i=1;i&lt;=Math.min(pdf.numPages,100);i++){const page=await pdf.getPage(i);const c=await page.getTextContent();parts.push(c.items.map(x=&gt;x.str).join(' '));}
 const combined=parts.join('\n\n').trim();if(combined.length&lt;40) throw Error('No selectable text found. Scanned PDFs need OCR.');
 $('script').value=combined.slice(0,45000);$('pdfStatus').textContent=`Loaded ${pdf.numPages} page(s), ${combined.length} characters (AI analyzes first 12,000 per episode).`;
}catch(e){$('pdfStatus').textContent='PDF error: '+e.message;}}
function manualSplit(){const s=cleanSettings(),cnt=s.count;
 let arr=[];if(s.mode==='auto'){
 const k=s.lang==='Urdu'?[`ایک دن ${s.topic} کی کہانی شروع ہوئی۔`,`ہیرو کو ایک حیرت انگیز چیز ملی۔`,`دوستوں نے مل کر ایک مشکل حل کرنے کی کوشش کی۔`,`پھر ایک جادوئی راز سامنے آیا۔`,`دوستی اور ہمت سے سب خوش ہو گئے۔`]:s.lang==='Arabic'?[`في يوم جميل بدأت مغامرة ${s.topic}.`,`اكتشف البطل شيئا عجيبا.`,`تعاون الأصدقاء لحل المشكلة.`,`انكشف السر السحري.`,`انتهت القصة بالصداقة والمرح.`]:[`One day, ${s.topic}.`,`The hero discovered a mysterious clue.`,`Two friends explored a wonderful place.`,`They solved a tricky problem together.`,`Everyone learned about kindness and courage.`];
 arr=Array.from({length:cnt},(_,i)=&gt;k[i%k.length]);
 }else{const txt=s.script.trim();if(!txt)throw Error('Paste your script or upload text PDF first.');let paras=txt.split(/\n\s*\n|(?&lt;=[.!?۔؟])\s+(?=[^\n])/u).map(x=&gt;x.trim()).filter(Boolean);if(paras.length&lt;cnt){const words=txt.split(/\s+/u);paras=Array.from({length:cnt},(_,i)=&gt;words.slice(Math.floor(i*words.length/cnt),Math.floor((i+1)*words.length/cnt)).join(' '));}const per=Math.ceil(paras.length/cnt);arr=Array.from({length:cnt},(_,i)=&gt;paras.slice(i*per,(i+1)*per).join(' ').slice(0,350)).filter(Boolean);}
 return arr.map((caption,i)=&gt;({caption,visual:`Scene ${i+1} of a family friendly children's story. ${s.topic}. ${caption}. Character appearance: ${s.character}. ${s.style} eyes expressive, beautifully lit original fantasy environment, dynamic clear composition, artful professional 3D animated feature film still, richly detailed, soft cinematic depth of field, no letters or watermark.`,img:''}));
}
function normalize(arr){scenes=arr.map((x,i)=&gt;({caption:String(x.caption||'').slice(0,800),visual:String(x.visual||'').slice(0,1800),img:x.img||'',id:i+1}));renderScenes();setStatus(`${scenes.length} scenes ready. Generate images next.`);}
$('storyLocal').onclick=()=&gt;{try{normalize(manualSplit());log('Scenes prepared locally. These are simple template descriptions, not AI-written.');}catch(e){log(e.message,true)}};
$('storyAI').onclick=async()=&gt;{let s=cleanSettings(); if(s.mode==='pdf'||s.mode==='manual'){if(s.script.trim().length&lt;20){log('Paste script / load PDF first.',true);return;}}const b=$('storyAI');b.disabled=true;log('AI is writing a new storyboard…');try{const d=await callWorker('/story',{...s,mode:s.mode==='auto'?'auto':'manual',language:s.lang});if(!d.scenes?.length)throw Error('No scenes received');normalize(d.scenes.map(x=&gt;({...x,img:''})));log('AI storyboard ready: '+d.title);}catch(e){log(e.message+' You can use “Prepare scenes without AI” instead.',true);}finally{b.disabled=false;}};
function renderScenes(){const holder=$('scenes');holder.replaceChildren();$('sceneLabel').textContent=scenes.length+' scenes';$('allImages').disabled=!scenes.length;$('clearImages').disabled=!scenes.length;
 scenes.forEach((s,i)=&gt;{const el=document.createElement('article');el.className='scene';
 const title=document.createElement('div');title.className='row';const h=document.createElement('h3');h.textContent=`Scene ${i+1}`;title.append(h);el.append(title);
 const im=document.createElement('img');im.alt=`Generated illustration for scene ${i+1}`;if(s.img)im.src=s.img;el.append(im);
 const cLabel=document.createElement('label');cLabel.textContent='Narration / caption';el.append(cLabel);
 const cap=document.createElement('textarea');cap.value=s.caption;cap.oninput=()=&gt;{s.caption=cap.value};el.append(cap);
 const vLabel=document.createElement('label');vLabel.textContent='AI image prompt (editable)';el.append(vLabel);
 const visual=document.createElement('textarea');visual.className='mini';visual.value=s.visual;visual.oninput=()=&gt;{s.visual=visual.value};el.append(visual);
 const stat=document.createElement('div');stat.className='status';stat.textContent=s.img?'Image ready':'No AI image yet';el.append(stat);
 const actions=document.createElement('div');actions.className='actions';const gen=document.createElement('button');gen.className='small';gen.textContent='Generate AI image';gen.onclick=()=&gt;generateImage(i,gen,stat,im);actions.append(gen);
 const up=document.createElement('input');up.type='file';up.accept='image/*';up.style='display:none';up.onchange=async e=&gt;{const file=e.target.files?.[0];if(!file)return;try{s.img=await readImageFile(file);im.src=s.img;stat.textContent='Custom image added';}catch(ex){stat.textContent=ex.message}};
 const upl=document.createElement('button');upl.className='small alt';upl.textContent='Upload image';upl.onclick=()=&gt;up.click();actions.append(upl,up);
 const dl=document.createElement('button');dl.className='small alt';dl.textContent='Save image';dl.onclick=()=&gt;{if(s.img)downloadData(s.img,`scene-${i+1}.jpg`);else stat.textContent='Generate/upload image first'};actions.append(dl);
 el.append(actions);holder.append(el);});}
function readImageFile(file){return new Promise((resolve,reject)=&gt;{if(file.size&gt;7*1024*1024)return reject(Error('Image must be under 7 MB'));const fr=new FileReader();fr.onload=()=&gt;resolve(fr.result);fr.onerror=()=&gt;reject(Error('File read failed'));fr.readAsDataURL(file)})}
async function generateImage(i,btn,stat,im){btn.disabled=true;stat.textContent='Generating FLUX image…';const s=scenes[i];try{
 const bible=$('character').value.trim();let prompt=s.visual;
 if(!prompt.toLowerCase().includes('consistent'))prompt+=`. Character description: ${bible}.`;
 prompt+=` Premium original children's cartoon art, professionally lit, strong color design, no words, no watermark.`;
 const seed=38000+Number($('ep').value||1)*100+ i;
 const res=await callWorker('/image',{prompt:prompt.slice(0,1900),seed});s.img=res.image;im.src=s.img;stat.textContent='AI image ready ✓';return true;
 }catch(e){stat.textContent='Error: '+e.message;return false;}finally{btn.disabled=false;}}
$('allImages').onclick=async()=&gt;{const b=$('allImages');b.disabled=true;const nodes=[...document.querySelectorAll('.scene')];let okay=0;
 for(let i=0;i&lt;scenes.length;i++){if(!scenes[i].img){const btn=nodes[i].querySelector('button');const stat=nodes[i].querySelector('.status');const im=nodes[i].querySelector('img');log(`Generating image ${i+1}/${scenes.length}…`);if(await generateImage(i,btn,stat,im))okay++;}}
 log(`${okay} images generated. If any failed, retry individually.`);b.disabled=false;};
$('clearImages').onclick=()=&gt;{scenes.forEach(s=&gt;s.img='');renderScenes();log('Scene images cleared from page. Other saved copies are unaffected.');};
function downloadData(data,name){const a=document.createElement('a');a.href=data;a.download=name;document.body.append(a);a.click();a.remove()}
$('saveStory').onclick=()=&gt;{const s=cleanSettings();const payload={studio:'AI Cartoon Studio V3',version:3,settings:s,scenes:scenes.map(x=&gt;({caption:x.caption,visual:x.visual,img:x.img}))};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);downloadData(url,'cartoon-studio-v3-project.json');setTimeout(()=&gt;URL.revokeObjectURL(url),1000);};
$('loadProject').onchange=async e=&gt;{try{const f=e.target.files?.[0];if(!f)return;const d=JSON.parse(await f.text());if(d.version!==3 || !Array.isArray(d.scenes))throw Error('Not a V3 project');const x=d.settings||{};
 for(const [key,id] of Object.entries({mode:'mode',lang:'lang',topic:'topic',script:'script',character:'character',style:'style',episode:'ep',episodes:'epTotal',count:'sceneCount',duration:'duration',format:'format'})){if(x[key]!=null)$(id).value=x[key];}
 modeUI();normalize(d.scenes);log('Project restored locally. Secret access code is never saved.');}catch(ex){log(ex.message,true)}};
function setupCanvas(){const vertical=$('format').value==='short';const c=$('canvas');c.width=vertical?540:960;c.height=vertical?960:540;return c;}
const wrapLines=(ctx,t,maxWidth,maxLines)=&gt;{const words=String(t).split(/\s+/u).filter(Boolean);let rows=[],current='';for(const w of words){let candidate=current?current+' '+w:w;if(ctx.measureText(candidate).width&gt;maxWidth&amp;&amp;current){rows.push(current);current=w}else current=candidate}if(current)rows.push(current);return rows.slice(0,maxLines)};
function loadBitmap(src){return new Promise(resolve=&gt;{if(!src)return resolve(null);const im=new Image();im.onload=()=&gt;resolve(im);im.onerror=()=&gt;resolve(null);im.src=src;});}
async function prepareImages(){return Promise.all(scenes.map(s=&gt;loadBitmap(s.img)))}
function drawScene(ctx,image,s,p,duration,total){const W=ctx.canvas.width,H=ctx.canvas.height;
ctx.fillStyle='#0e152b';ctx.fillRect(0,0,W,H);
if(image){const zoom=1.07+0.10*p,scale=Math.max(W/image.width,H/image.height)*zoom;const w=image.width*scale,h=image.height*scale;
 const dx=(W-w)/2+Math.sin(p*Math.PI*2)*Math.min(18,(w-W)/3),dy=(H-h)/2+Math.cos(p*Math.PI)*Math.min(16,(h-H)/3);
 ctx.drawImage(image,dx,dy,w,h);
}else{const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#312455');grad.addColorStop(1,'#0c3159');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#dce9ff';ctx.font=`bold ${Math.max(19,W/22)}px sans-serif`;ctx.textAlign='center';ctx.fillText('Generate an AI scene image',W/2,H/2);}
const dark=ctx.createLinearGradient(0,H*.56,0,H);dark.addColorStop(0,'#0000');dark.addColorStop(1,'#030819e8');ctx.fillStyle=dark;ctx.fillRect(0,H*.52,W,H*.48);
const font=Math.round(Math.max(18,Math.min(29,W/28)));ctx.font=`700 ${font}px system-ui, Arial, sans-serif`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.direction='auto';ctx.shadowColor='#000';ctx.shadowBlur=7;
const lines=wrapLines(ctx,s.caption,W*.85,5);let y=H-32-(lines.length-1)*(font+8);
for(const line of lines){ctx.fillText(line,W/2,y,W*.88);y+=font+8;}ctx.shadowBlur=0;
ctx.fillStyle='#e5d8ff';ctx.font=`${Math.max(11,Math.round(W/48))}px Arial`;ctx.fillText(`${$('ep').value}/${$('epTotal').value} • AI Cartoon Studio`,W/2,25);
ctx.fillStyle='#b589ff';ctx.fillRect(0,H-5,W*Math.min(1,total/duration),5);
}
function speakCaptions(){if(!window.speechSynthesis){log('Speech synthesis unavailable in this browser',true);return;}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(scenes.map(s=&gt;s.caption).join(' '));utter.lang=$('speakLang').value;utter.rate=.93;speechSynthesis.speak(utter);log('Device voice preview playing. Voice will NOT be recorded in video.');}
$('speak').onclick=()=&gt;{if(!scenes.length)return log('Prepare scenes first',true);speakCaptions()};
$('audioFile').onchange=async e=&gt;{const f=e.target.files?.[0];if(!f){loadedAudio=null;return;}if(f.size&gt;60*1024*1024){log('Audio file too large (60 MB max)',true);return;}loadedAudio=f;log('Narration/audio attached: '+f.name);};
$('stop').onclick=()=&gt;{if(stopRun)stopRun();if(window.speechSynthesis)speechSynthesis.cancel();};
async function playback(record){if(running)throw Error('A video is already running');if(!scenes.length)throw Error('Prepare scenes first.');
 const c=setupCanvas(),ctx=c.getContext('2d');let images=await prepareImages();
 const duration=Number($('duration').value),per=duration/scenes.length,fps=16;
 if(record&amp;&amp;(!c.captureStream||!window.MediaRecorder))throw Error('This browser does not support WebM recording. Try Chrome on Android.');
 let stream=null,recorder=null,parts=[],audioContext=null,audioSource=null;
 if(record){stream=c.captureStream(fps);
  if(loadedAudio){try{audioContext=new (window.AudioContext||window.webkitAudioContext)();const buffer=await audioContext.decodeAudioData(await loadedAudio.arrayBuffer());audioSource=audioContext.createBufferSource();audioSource.buffer=buffer;const dest=audioContext.createMediaStreamDestination();audioSource.connect(dest);audioSource.connect(audioContext.destination);dest.stream.getAudioTracks().forEach(t=&gt;stream.addTrack(t));}catch(e){log('Audio could not be mixed: '+e.message,true);}}
  const type=['video/webm;codecs=vp8,opus','video/webm;codecs=vp8','video/webm'].find(t=&gt;MediaRecorder.isTypeSupported(t));
  if(!type)throw Error('This browser cannot record WebM.');
  recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:1800000});
  recorder.ondataavailable=e=&gt;{if(e.data.size)parts.push(e.data)};
  recorder.onstop=()=&gt;{if(parts.length){const blob=new Blob(parts,{type:'video/webm'});const u=URL.createObjectURL(blob);downloadData(u,`AI-Cartoon-Episode-${$('ep').value}.webm`);setTimeout(()=&gt;URL.revokeObjectURL(u),30000);setStatus('Video saved. Open Downloads to find the WebM file.');}else setStatus('No video data was recorded.');};
 }
 running=true;let halted=false;stopRun=()=&gt;{halted=true;};let started=performance.now();
 drawScene(ctx,images[0],scenes[0],0,duration,0);
 if(record){recorder.start(1000);mediaRec=recorder;if(audioSource)audioSource.start();}
 setStatus(record?'Recording in real time… Keep this tab open.':'Preview playing…');
 return new Promise(resolve=&gt;{let lastFrame=0;function frame(t){const elapsed=Math.min((t-started)/1000,duration),i=Math.min(scenes.length-1,Math.floor(elapsed/per)),p=(elapsed-i*per)/per;
 if(t-lastFrame&gt;=45){drawScene(ctx,images[i],scenes[i],p,duration,elapsed);lastFrame=t;}
 if(!halted&amp;&amp;elapsed&lt;duration){requestAnimationFrame(frame)}else{
 running=false;stopRun=null;if(record){try{if(recorder.state!=='inactive')recorder.stop();}catch{};if(audioSource)try{audioSource.stop()}catch{};
 stream?.getTracks().forEach(tr=&gt;tr.stop());if(audioContext)audioContext.close().catch(()=&gt;{});
 }else setStatus(halted?'Preview stopped':'Preview complete.');resolve();}}
 requestAnimationFrame(frame);});}
$('preview').onclick=async()=&gt;{try{await playback(false)}catch(e){log(e.message,true)}};
$('record').onclick=async()=&gt;{const b=$('record');b.disabled=true;try{await playback(true)}catch(e){log(e.message,true);setStatus('Recording failed.')}finally{b.disabled=false;}};
modeUI();setupCanvas();
